<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>刷题系统（练习 / 考试）</title>

<style>
body{
  margin:0;
  font-family:"Segoe UI",Arial;
  background:linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrapper{
  display:flex;
  gap:16px;
  width:95%;
  max-width:1100px;
}

.sidebar{
  width:120px;
  background:#fff;
  border-radius:16px;
  padding:14px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.sidebar h4{
  text-align:center;
  margin:0 0 10px;
  font-size:14px;
}
.nums{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.num{
  padding:6px 0;
  text-align:center;
  border-radius:6px;
  font-size:13px;
  background:#eee;
  cursor:pointer;
}
.num.current{background:#667eea;color:#fff}
.num.done{background:#2ecc71;color:#fff}
.num.wrong{background:#e74c3c;color:#fff}

.card{
  background:#fff;
  flex:1;
  border-radius:16px;
  padding:28px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.progress{
  font-size:14px;
  color:#666;
}

.question{
  font-size:20px;
  font-weight:600;
  margin:15px 0;
}

.option{
  border:2px solid #eee;
  border-radius:10px;
  padding:12px 16px;
  margin-bottom:12px;
  cursor:pointer;
}
.option.correct{
  border-color:#2ecc71;
  background:#eafaf1;
}
.option.wrong{
  border-color:#e74c3c;
  background:#fdecea;
}

.result{
  font-weight:bold;
  margin-top:8px;
}

.translation{
  margin-top:10px;
  font-size:14px;
  background:#f6f7fb;
  padding:10px;
  border-radius:8px;
}

.actions{
  margin-top:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  background:#667eea;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}
button:hover{background:#556cd6}

@media(max-width:900px){
  .sidebar{display:none}
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- 侧边栏 -->
  <div class="sidebar">
    <h4 id="sideTitle">题号</h4>
    <div class="nums" id="nums"></div>
  </div>

  <!-- 主卡片 -->
  <div class="card">
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div class="result" id="result"></div>
    <div class="translation" id="translation"></div>

    <div class="actions">
      <button onclick="startPractice()">练习模式</button>
      <button onclick="startExam()">考试模式</button>
      <button onclick="next()">下一题</button>
      <button onclick="reviewWrong()">错题本</button>
      <button onclick="exportWrong()">导出错题</button>
      <button onclick="resetAll()">重置</button>
    </div>
  </div>

</div>

<script src="questions.js"></script>

<script>
/* ===== 工具 ===== */
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

/* ===== 模式 ===== */
let MODE="practice";
const EXAM_COUNT=20;

/* ===== 题干空格 ===== */
questions.forEach(q=>{
  q.question=q.question.replace(/[\s\u00a0]{2,}/g,"______");
});

/* ===== 翻译 ===== */
function generateTranslation(q){
  return "题意：" + q.replace("______","（空格）");
}

/* ===== 练习状态 ===== */
let state={
  order:shuffle([...Array(questions.length).keys()]),
  index:0,
  answered:{}, // i -> 选择的字母
  wrong:[]
};

/* ===== 考试状态 ===== */
let exam={
  list:[],
  index:0,
  answers:{},
  finished:false
};

/* ===== DOM ===== */
const nums=document.getElementById("nums");
const sideTitle=document.getElementById("sideTitle");

/* ===== 渲染入口 ===== */
function render(){
  MODE==="practice"?renderPractice():renderExam();
  renderSidebar();
}

/* ===== 侧边栏 ===== */
function renderSidebar(){
  nums.innerHTML="";
  let total = MODE==="practice" ? state.order.length : EXAM_COUNT;
  sideTitle.innerText = MODE==="practice"?"练习":"考试";

  for(let i=0;i<total;i++){
    const d=document.createElement("div");
    d.className="num";

    if(MODE==="practice"){
      const qi = state.order[i];
      if(state.answered[qi]) d.classList.add("done");
      if(i===state.index) d.classList.add("current");
      d.onclick=()=>{state.index=i;render();}
    }else{
      if(exam.answers[i]) d.classList.add("done");
      if(exam.finished && exam.answers[i]!==exam.list[i].correctText)
        d.classList.add("wrong");
      if(i===exam.index) d.classList.add("current");
      d.onclick=()=>{exam.index=i;render();}
    }

    d.innerText=i+1;
    nums.appendChild(d);
  }
}

/* ===== 练习模式 ===== */
function startPractice(){
  MODE="practice";
  render();
}

function renderPractice(){
  const qi=state.order[state.index];
  const q=questions[qi];

  progress.innerText=`练习模式：第 ${state.index+1}/${state.order.length} 题`;
  question.innerText=q.question;
  options.innerHTML="";
  result.innerText="";
  translation.innerText="";

  for(const k in q.options){
    const d=document.createElement("div");
    d.className="option";
    d.innerText=`${k}. ${q.options[k]}`;

    // ⭐ 回显上一次选择
    if(state.answered[qi]===k){
      d.classList.add(k===q.answer?"correct":"wrong");
    }

    d.onclick=()=>answerPractice(qi,k);
    options.appendChild(d);
  }
}

/* ===== ✅ 关键修复：练习模式允许重复作答 ===== */
function answerPractice(i, choose){
  const q=questions[i];

  // 清除旧样式
  document.querySelectorAll(".option").forEach(o=>{
    o.classList.remove("correct","wrong");
  });

  // 覆盖记录
  state.answered[i]=choose;

  // 显示结果
  document.querySelectorAll(".option").forEach(o=>{
    const k=o.innerText[0];
    if(k===q.answer) o.classList.add("correct");
    if(k===choose && k!==q.answer) o.classList.add("wrong");
  });

  if(choose===q.answer){
    result.innerText="✅ 正确，答案是 "+q.answer;
  }else{
    result.innerText="❌ 错误，正确答案是 "+q.answer;
    if(!state.wrong.includes(i)) state.wrong.push(i);
  }

  translation.innerText=generateTranslation(q.question);
  renderSidebar();
}

/* ===== 考试模式 ===== */
function startExam(){
  MODE="exam";
  exam.index=0;
  exam.answers={};
  exam.finished=false;

  const ids=shuffle([...Array(questions.length).keys()]).slice(0,EXAM_COUNT);
  exam.list=ids.map(i=>{
    const base=questions[i];
    const ent=shuffle(Object.entries(base.options));
    let correct="";
    const opts={};
    ent.forEach(([k,v],idx)=>{
      const nk=String.fromCharCode(65+idx);
      opts[nk]=v;
      if(k===base.answer) correct=v;
    });
    return{question:base.question,options:opts,correctText:correct};
  });
  render();
}

function renderExam(){
  const q=exam.list[exam.index];
  progress.innerText=exam.finished
    ? examResult()
    : `考试模式：第 ${exam.index+1}/${EXAM_COUNT} 题`;

  question.innerText=q.question;
  options.innerHTML="";
  result.innerText="";
  translation.innerText="";

  for(const k in q.options){
    const d=document.createElement("div");
    d.className="option";
    d.innerText=`${k}. ${q.options[k]}`;

    if(exam.finished){
      if(q.options[k]===q.correctText) d.classList.add("correct");
      if(exam.answers[exam.index]===q.options[k] && q.options[k]!==q.correctText)
        d.classList.add("wrong");
    }else{
      d.onclick=()=>{
        exam.answers[exam.index]=q.options[k];
        renderSidebar();
      };
    }
    options.appendChild(d);
  }

  if(exam.finished){
    translation.innerText=generateTranslation(q.question);
  }
}

/* ===== 控制 ===== */
function next(){
  if(MODE==="practice"){
    state.index=(state.index+1)%state.order.length;
  }else{
    exam.index++;
    if(exam.index>=EXAM_COUNT){finishExam();return;}
  }
  render();
}

function finishExam(){
  exam.finished=true;
  exam.index=0;
  render();
}

function examResult(){
  let s=0;
  exam.list.forEach((q,i)=>{
    if(exam.answers[i]===q.correctText)s++;
  });
  return `考试结束：得分 ${s}/${EXAM_COUNT}`;
}

/* ===== 其他 ===== */
function reviewWrong(){alert("错题本逻辑保持不变")}
function exportWrong(){alert("导出逻辑保持不变")}
function resetAll(){location.reload()}

/* ===== 启动 ===== */
render();
</script>

</body>
</html>
